name: Defect
description: Report a reproducible repository, contract, or implementation defect.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior or invariant
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands and environment; never include credentials or private traces.
    validations:
      required: true
  - type: input
    id: provenance
    attributes:
      label: Observed producer and source provenance
      description: Include the commit when available, dirty/clean fact, and relevant source, config, or image digest.
      placeholder: Producer commit; dirty=true/false; relevant digest(s)
    validations:
      required: true
