apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: baseline-agent-broad-public-https
  namespace: fw-baseline
spec:
  podSelector:
    matchLabels:
      faultwitness.dev/principal: baseline-agent
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - {protocol: TCP, port: 443}
