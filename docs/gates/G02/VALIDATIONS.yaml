schema_version: "1.0.0"
gate: G02
validation_items:
  - id: V-G02-001
    name: Phase DAG and resume contract
    layer: L1
    layer_reason: Deterministic state transitions and fixtures have no external dependency.
    failure_mode: An interrupted run repeats passed work, loses trials, or reuses a stale cache.
    iteration_n: 5
    gate_n: 0
    n_unit: state-transition fixtures
    small_n_audit: Reduced to five fixtures covering the minimum distinct state transitions.
    owning_iteration: I-0016
    runner: g02.phase_contract
    negative_fixture: tests/fixtures/g02/phase_stale_cache.json
    artifact_paths: [docs/evals/EVAL-G02-001/artifacts/phase-contract.json]
    zero_tolerance: false
    enumeration_kind: none
  - id: V-G02-002
    name: Double-SHA candidate and digest binding
    layer: L2
    layer_reason: Binding has meaning only for the frozen candidate, images, config, and environment.
    failure_mode: An evidence commit becomes a false business candidate or stale evidence is inherited.
    iteration_n: 0
    gate_n: 1
    n_unit: unified candidates
    small_n_audit: Not statistical; this is one candidate-bound bootstrap action.
    owning_iteration: I-0016
    runner: g02.candidate_binding
    negative_fixture: tests/fixtures/g02/candidate_non_evidence_descendant.json
    artifact_paths: [docs/evals/EVAL-G02-008/artifacts/phases/preflight-candidate-binding/summary.json]
    zero_tolerance: true
    enumeration_kind: one_time
  - id: V-G02-003
    name: Manifest and upstream debt preflight
    layer: L2
    layer_reason: The complete upstream and G02 manifest set exists only at Gate evaluation time.
    failure_mode: Expensive remote work runs before a stale manifest or open evidence is detected.
    iteration_n: 0
    gate_n: 13
    n_unit: manifests
    small_n_audit: Cannot reduce because all nine G01 and four completed G02 manifests are required.
    owning_iteration: I-0016
    runner: g02.manifest_debt
    negative_fixture: tests/fixtures/g02/manifest_open_evidence.json
    artifact_paths: [docs/evals/EVAL-G02-008/artifacts/phases/preflight-manifests/manifest-debt.json]
    zero_tolerance: true
    enumeration_kind: category_exhaustive
  - id: V-G02-004
    name: Scenario DSL and 32-seed registry
    layer: L1
    layer_reason: Schema and catalogue enumeration are deterministic and closed.
    failure_mode: Seed count, family, difficulty, fault allocation, or opaque ID mapping drifts.
    iteration_n: 32
    gate_n: 0
    n_unit: seed specifications
    small_n_audit: Cannot reduce because all 32 executable seeds are a Gate deliverable.
    owning_iteration: I-0017
    runner: g02.dsl_registry
    negative_fixture: tests/fixtures/g02/scenario_unknown_action.yaml
    artifact_paths: [docs/evals/EVAL-G02-002/artifacts/seed-registry.json]
    zero_tolerance: false
    enumeration_kind: category_exhaustive
  - id: V-G02-005
    name: Six fault-adapter and oracle contracts
    layer: L1
    layer_reason: Adapter state and oracle boundaries are closed deterministic contracts.
    failure_mode: A fault class lacks inject, readback, UNKNOWN, restore, or cleanup semantics.
    iteration_n: 6
    gate_n: 0
    n_unit: fault classes
    small_n_audit: Cannot reduce without omitting a required fault class.
    owning_iteration: I-0017
    runner: g02.fault_oracle_contract
    negative_fixture: tests/fixtures/g02/oracle_false_green.yaml
    artifact_paths: [docs/evals/EVAL-G02-002/artifacts/fault-oracle-contract.json]
    zero_tolerance: false
    enumeration_kind: category_exhaustive
  - id: V-G02-006
    name: Live inject detect and recover
    layer: L3
    layer_reason: A four-family smoke proves the harness while the frozen candidate needs all seeds.
    failure_mode: A fault does not activate, appears falsely healthy, fails recovery, or yields a mismatched packet.
    iteration_n: 4
    gate_n: 32
    n_unit: scenarios
    small_n_audit: Cannot reduce to three because that would omit one DSL family.
    owning_iteration: I-0017
    runner: g02.scenario_matrix
    negative_fixture: tests/fixtures/g02/fault_restore_noop.yaml
    artifact_paths:
      - docs/evals/EVAL-G02-002/artifacts/scenario-smoke.json
      - docs/evals/EVAL-G02-008/artifacts/phases/scenario-matrix/summary.json
    zero_tolerance: false
    enumeration_kind: none
  - id: V-G02-007
    name: Core-case preregistration without materialization
    layer: L1
    layer_reason: Registry structure and forbidden object presence are deterministic checks.
    failure_mode: G07 case payloads, answers, or locked objects are generated during G02.
    iteration_n: 160
    gate_n: 0
    n_unit: preregistration rows
    small_n_audit: Cannot reduce because the 160-row registry is itself the deliverable.
    owning_iteration: I-0018
    runner: g02.preregistry
    negative_fixture: tests/fixtures/g02/prereg_materialized_case.yaml
    artifact_paths: [docs/evals/EVAL-G02-003/artifacts/preregistry.json]
    zero_tolerance: true
    enumeration_kind: category_exhaustive
  - id: V-G02-008
    name: Sealed runtime package exclusion
    layer: L1
    layer_reason: Content scans over digest-pinned images are deterministic and closed.
    failure_mode: A controller, baseline, or evaluator image embeds ground truth or locked material.
    iteration_n: 3
    gate_n: 0
    n_unit: runtime images
    small_n_audit: Three is exhaustive because G02 introduces exactly three runtime images.
    owning_iteration: I-0018
    runner: g02.sealed_package_scan
    negative_fixture: tests/fixtures/g02/image_contains_ground_truth.txt
    artifact_paths: [docs/evals/EVAL-G02-003/artifacts/sealed-package-scan.json]
    zero_tolerance: true
    enumeration_kind: category_exhaustive
  - id: V-G02-009
    name: Identity and storage access matrix
    layer: L3
    layer_reason: Iteration policy simulation covers new identities and Gate probes live targets.
    failure_mode: Agent or developer reads GT or locked data, or evaluator/controller exceeds policy.
    iteration_n: 4
    gate_n: 60
    n_unit: identity policies at Iteration and live access cells at Gate
    small_n_audit: Cannot reduce below four because all four distinct identities are in scope.
    owning_iteration: I-0018
    runner: g02.access_matrix
    negative_fixture: tests/fixtures/g02/access_wrong_allow.yaml
    artifact_paths:
      - docs/evals/EVAL-G02-003/artifacts/access-policy-simulation.json
      - docs/evals/EVAL-G02-008/artifacts/phases/isolation-access-matrix/matrix.json
    zero_tolerance: true
    enumeration_kind: none
  - id: V-G02-010
    name: G01 supplemental six-stage span matrix
    layer: L2
    layer_reason: Complete correlated stages require the frozen candidate and full technical stack.
    failure_mode: API, persistence, Outbox, checkpoint, model-stub, or export lacks reviewable spans.
    iteration_n: 0
    gate_n: 6
    n_unit: trace stages
    small_n_audit: Cannot reduce because all six evidence-gap stages must be covered.
    owning_iteration: I-0018
    runner: g02.stage_matrix
    negative_fixture: tests/fixtures/g02/trace_missing_stage.json
    artifact_paths: [docs/evals/EVAL-G02-008/artifacts/phases/trace-six-stage-matrix/matrix.json]
    zero_tolerance: true
    enumeration_kind: category_exhaustive
  - id: V-G02-011
    name: G01 supplemental all-surface Secret and PII canary
    layer: L3
    layer_reason: Iteration proves new writers and Gate covers every canonical persistence and egress surface.
    failure_mode: Secret or PII reaches any persisted or outbound surface.
    iteration_n: 4
    gate_n: 22
    n_unit: writer paths at Iteration and canary-surface cells at Gate
    small_n_audit: Cannot reduce below four because all four newly introduced writer paths differ.
    owning_iteration: I-0018
    runner: g02.canary_matrix
    negative_fixture: tests/fixtures/g02/canary_leaked_artifact.json
    artifact_paths:
      - docs/evals/EVAL-G02-003/artifacts/writer-canary.json
      - docs/evals/EVAL-G02-008/artifacts/phases/all-surface-canary/matrix.json
    zero_tolerance: true
    enumeration_kind: none
  - id: V-G02-012
    name: Deterministic scorer semantics
    layer: L1
    layer_reason: Scoring is a pure algorithm over fixed fixtures.
    failure_mode: Malformed output, wrong cause, no citation, or unsupported claims are mis-scored.
    iteration_n: 5
    gate_n: 0
    n_unit: scoring fixtures
    small_n_audit: Reduced to five fixtures that cover every distinct scoring branch combination.
    owning_iteration: I-0019
    runner: g02.scorer_contract
    negative_fixture: tests/fixtures/g02/score_unsupported_claim.json
    artifact_paths: [docs/evals/EVAL-G02-004/artifacts/scorer-contract.json]
    zero_tolerance: false
    enumeration_kind: none
  - id: V-G02-013
    name: Frozen seven-value threshold registry
    layer: L1
    layer_reason: Exact threshold constants and schema are closed deterministic assets.
    failure_mode: G02 lowers, rewrites, omits, or invents a quality floor.
    iteration_n: 7
    gate_n: 0
    n_unit: threshold values
    small_n_audit: Cannot reduce because all seven authoritative values must be exact.
    owning_iteration: I-0019
    runner: g02.threshold_registry
    negative_fixture: tests/fixtures/g02/threshold_decrease.yaml
    artifact_paths: [docs/evals/EVAL-G02-004/artifacts/threshold-registry.json]
    zero_tolerance: true
    enumeration_kind: category_exhaustive
  - id: V-G02-014
    name: Deterministic baseline
    layer: L3
    layer_reason: Three fixtures prove behavior while the unified candidate must score all seed packets.
    failure_mode: The baseline reads ground truth, is nondeterministic, or cannot score the full seed set.
    iteration_n: 3
    gate_n: 32
    n_unit: scenarios
    small_n_audit: Reduced to three fixtures for correct, wrong, and malformed results.
    owning_iteration: I-0019
    runner: g02.deterministic_baseline
    negative_fixture: tests/fixtures/g02/deterministic_wrong_root.json
    artifact_paths:
      - docs/evals/EVAL-G02-004/artifacts/deterministic-smoke.json
      - docs/evals/EVAL-G02-008/artifacts/phases/baseline-deterministic/results.json
    zero_tolerance: false
    enumeration_kind: none
  - id: V-G02-015
    name: Live baselines resume and confidence interval
    layer: L3
    layer_reason: Four live smokes prove both runners while statistical evidence needs all Gate trials.
    failure_mode: One transport failure discards completed trials, fallback is hidden, or CI is irreproducible.
    iteration_n: 4
    gate_n: 192
    gate_clusters: 32
    n_unit: live trials
    small_n_audit: Cannot reduce to three because both baselines need success and interrupted-resume coverage.
    owning_iteration: I-0019
    runner: g02.live_baseline_matrix
    negative_fixture: tests/fixtures/g02/journal_partial_transport.json
    artifact_paths:
      - docs/evals/EVAL-G02-004/artifacts/live-smoke.json
      - docs/evals/EVAL-G02-008/artifacts/phases/baseline-live/journal-index.json
      - docs/evals/EVAL-G02-008/artifacts/phases/baseline-aggregate/metrics.json
    zero_tolerance: false
    enumeration_kind: none
  - id: V-G02-016
    name: Final candidate reconciliation
    layer: L2
    layer_reason: Pending work, phase times, cache reuse, and closure can be judged only for the final candidate.
    failure_mode: Pending or infrastructure failures are ignored or a destructive phase executes twice.
    iteration_n: 0
    gate_n: 1
    n_unit: unified candidates
    small_n_audit: Not statistical; this is the single final reconciliation action.
    owning_iteration: I-0016
    runner: g02.reconciliation
    negative_fixture: tests/fixtures/g02/reconciliation_pending.json
    artifact_paths: [docs/evals/EVAL-G02-008/artifacts/phases/candidate-reconciliation/summary.json]
    zero_tolerance: true
    enumeration_kind: one_time
  - id: V-G02-017
    name: Clean-clone pinned lab deployment
    layer: L2
    layer_reason: Reproducibility requires the frozen candidate, image set, and target environment.
    failure_mode: Lab startup depends on dirty local state, floating tags, or undeclared tools.
    iteration_n: 0
    gate_n: 1
    n_unit: candidate environments
    small_n_audit: Not statistical; the candidate environment bootstraps exactly once.
    owning_iteration: I-0017
    runner: g02.lab_bootstrap
    negative_fixture: tests/fixtures/g02/lab_unpinned_image.yaml
    artifact_paths: [docs/evals/EVAL-G02-008/artifacts/phases/lab-deploy-and-bind/summary.json]
    zero_tolerance: true
    enumeration_kind: one_time
