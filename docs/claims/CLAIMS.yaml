    statement: "G02 has a candidate-bound fault lab with 32 executable seed specifications, six exact-restoring adapters, and four live Iteration smoke scenarios."
    status: verified
    requirements: [REQ-EVAL-001, REQ-EVAL-002, REQ-EVAL-003]
    evidence:
